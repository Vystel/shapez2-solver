[package]
name = "shapez2-solver"
version = "1.0.0"
description = "Desktop packaging for Shapez 2 Solver"
authors = ["Shapez 2 Solver contributors"]
license = "MIT"
repository = "https://github.com/Vystel/shapez2-solver"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "shapez2_solver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [] }
